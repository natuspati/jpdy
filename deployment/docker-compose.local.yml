services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - jpdy_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    env_file:
      - local.env
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - jpdy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../be
    command:
      [
        "sh",
        "-c",
        "uv run alembic upgrade head && PYTHONPATH=/app/src uv run /scripts/seed_local.py",
      ]
    env_file:
      - local.env
    volumes:
      - ./scripts/seed_local.py:/scripts/seed_local.py:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../be
    env_file:
      - local.env
    expose:
      - "8000"
    volumes:
      - jpdy_media_data:/media
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; assert urlopen('http://localhost:$${BE_PORT}/api/health').status == 200\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nginx:
    build:
      context: ..
      dockerfile: deployment/nginx/Dockerfile.local
      args:
        - VITE_API_URL
        - VITE_SOCKET_URL
        - VITE_SOCKET_PATH
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT}:80"
    volumes:
      - jpdy_media_data:/srv/jpdy-media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/api/health | grep -q '\"status\":\"healthy\"'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  jpdy_redis_data:
  jpdy_postgres_data:
  jpdy_media_data:
