# Public game-night overlay: run via scripts/jpdy.sh, not directly.
# Exposes nginx through Tailscale Funnel; nothing listens on the LAN/WAN.
services:
  postgres:
    env_file: !override
      - prod.env

  migrate:
    env_file: !override
      - prod.env
    # No seed: it creates demo accounts with known passwords.
    command: ["uv", "run", "alembic", "upgrade", "head"]

  backend:
    env_file: !override
      - prod.env
    deploy:
      replicas: ${BE_REPLICAS:-2}

  tailscale:
    image: tailscale/tailscale:stable
    hostname: jpdy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: jpdy
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - jpdy_tailscale_state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  jpdy_tailscale_state:
