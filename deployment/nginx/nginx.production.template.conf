# Fill server_name, certificate paths, and upstream networking outside source
# control. Keep the same routes and headers as nginx.local.conf.
server {
    listen 80;
    server_name ${SERVER_NAME};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${SERVER_NAME};
    ssl_certificate ${SSL_CERTIFICATE};
    ssl_certificate_key ${SSL_CERTIFICATE_KEY};

    # Copy location blocks from nginx.local.conf. The backend and media
    # storage must remain private; Nginx is sole browser-facing listener.
}
