# Global key: behind Tailscale Funnel every client shares the proxy's IP.
limit_req_zone $server_name zone=login:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 110m;

    # Re-resolve Docker DNS so backend replicas restarting with new IPs are picked up;
    # the variable forces per-request resolution and round-robins across replicas.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/media/(.+\.(?:jpg|jpeg|png|webp|mp3|m4a|aac|ogg|mp4))$ {
        alias /srv/jpdy-media/$1;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            audio/mpeg mp3;
            audio/mp4 m4a;
            audio/aac aac;
            audio/ogg ogg;
            video/mp4 mp4;
        }
        default_type application/octet-stream;
    }

    location /media/ {
        return 404;
    }

    location = /api/v1/user/sign-in {
        limit_req zone=login burst=20 nodelay;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
