[project]
name = "jpgy-be"
version = "0.1.0"
description = "Back-end for Jeopardy application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.136.1",
    "psycopg[binary]>=3.3.5",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.28",
    "python-socketio>=5.16.1",
    "redis>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "wsproto>=1.3.2",
]

[dependency-groups]
dev = [
    "aiohttp>=3.13.5",
    "fakeredis>=2.35.1",
    "polyfactory>=3.3.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-env>=1.6.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
addopts = "-n 4"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"


[tool.pytest_env]
BE_APP_ENVIRONMENT = "test"
BE_DB_NAME = "test_jpdy.db"
BE_DB_APPLY_MIGRATIONS = "True"

[tool.coverage.run]
omit = [
    "src/migrations/*",
    "src/models/*",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
indent-style = "space"

[tool.ruff.lint]
select = [
    "F", # Pyflakes (basic Python errors)
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort (import sorting)
    "UP", # pyupgrade (Python version upgrade)
    "B", # flake8-bugbear (common bugs)
    "COM", # flake8-commas (trailing commas!)
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "PT", # flake8-pytest-style
    "ISC", # flake8-implicit-str-concat
    "ANN", # flake8-annotations
]
ignore = [
    "ANN401", # Allow Any type annotations
    "ANN204", # Don't require return type annotation for __init__ methods
    "ANN002", # Don't require type annotation for *args
    "ANN003", # Don't require type annotation for **kwargs
]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 2
max-statements = 50
max-locals = 15
max-public-methods = 20

[tool.ruff.lint.isort]
split-on-trailing-comma = true
force-wrap-aliases = true
combine-as-imports = false

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in all __init__.py files
"**/__init__.py" = ["F401"]
# Ignore undefined name in **/models for model declarations in SQLAlchemy relationships.
# Ignore mutable class attributes in **/models for table args declations in SQLAlchemy models.
"**/models/*" = ["F821", "RUF012"]
# Ignore long lines for migrations.
"src/migrations/versions/*.py" = ["E501"]
# Ignore type annotations for tests
"**/tests/**" = ["ANN"]
